name: Bancs

# 158 — les bancs tournent sur GitHub (machines en parallèle, dépôt public) :
# la coche du job « banc-sequentiel » tient lieu du séquentiel de fin de chantier.
# Pas sur `push` (tout tournerait deux fois). Pas non plus au passage à « prête » (CI sans gaspillage, 27/11/2026) :
# le code ne change pas à ce moment-là, le banc du dernier push fait foi, et la relance annulait un banc en cours.
# Aucun secret, aucune variable SUPABASE_* :
# la garde réseau des bancs (tests/banc/garde-reseau.js) reste la seule porte vers le réseau.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Les « trois verts de suite » d'une PR de banc (CLAUDE.md §4 quater) : le bouton « Run workflow » sur la branche,
  # avec le nombre de passages. Les passages jouent en même temps, sur des machines séparées ; chacun rend sa coche.
  workflow_dispatch:
    inputs:
      passages:
        description: 'Nombre de passages indépendants (3 pour la règle des trois verts)'
        required: true
        default: '3'
        type: choice
        options: ['1', '2', '3', '4', '5']

concurrency:
  group: bancs-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # 158 — le banc est calibré pour l'heure d'Aurélien (Haut-Rhin) : les semaines, les « aujourd'hui » et les
  # fenêtres de date se calculent dans le fuseau du navigateur. GitHub tourne en UTC ; sans cette ligne, des
  # contrôles de date lisent un autre jour que sur la machine de Claude (Europe/Paris).
  TZ: Europe/Paris

jobs:
  # La liste des passages : [1] pour une PR, [1, 2, 3] pour le bouton avec « 3 ». Les noms des jobs restent
  # « banc-complet » et « banc-sequentiel » quand il n'y a qu'un passage (la coche de la PR ne change pas de nom).
  passages:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
      n: ${{ steps.liste.outputs.n }}
    steps:
      - id: liste
        shell: bash
        env:
          DEMANDE: ${{ github.event.inputs.passages }}
        run: |
          n="${DEMANDE:-1}"
          case "$n" in 1|2|3|4|5) ;; *) n=1 ;; esac
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "liste=$(node -e "console.log(JSON.stringify(Array.from({length:$n},(_, i)=>i+1)))")" >> "$GITHUB_OUTPUT"

  banc-complet:
    needs: passages
    name: banc-complet${{ needs.passages.outputs.n != '1' && format(' (passage {0})', matrix.essai) || '' }}
    strategy:
      fail-fast: false
      matrix:
        essai: ${{ fromJSON(needs.passages.outputs.liste) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 243 : v2-fiche-rapide-232 lit le commit d'avant (git show)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aucun secret, aucune adresse de la base dans l'environnement
        shell: bash
        run: |
          if env | grep -Ei 'supabase\.co|SUPABASE|eyJ[A-Za-z0-9_-]{20,}'; then
            echo "::error::une variable d'environnement touche à Supabase ou ressemble à une clé"; exit 1
          fi
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium || npx playwright install chromium   # repli : miroir Ubuntu injoignable (11/11/2026)
      - name: Banc complet (vitesse + routines + service worker + création du profil + mouvement + tête 3+1 + séance en parallèle)
        shell: bash
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          # `npm test` n'est PAS rejoué ici : le job `unit` (test.yml) le joue, sur le même commit, avec les mêmes tests,
          # et il est une coche de la PR. Le jouer deux fois ralentissait ce job (il dispute les 4 cœurs aux navigateurs).
          node tests/banc/tout.js --sans-npm-test 2>&1 | tee banc-complet.txt
      - name: Résumé
        if: always()
        shell: bash
        run: |
          { echo '### Banc complet'; echo '```'; sed -n '/══ TOUT/,$p' banc-complet.txt | head -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotations (lisibles par l'API REST)
        if: always()
        run: node .github/annoter.js "Banc complet" banc-complet.txt $(grep -oP "code [1-9] .*journal \K\S+" /tmp/tout-*/banc-d-cran*.txt | head -3)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banc-complet-${{ matrix.essai }}
          path: |
            banc-complet.txt
            /tmp/tout-*
          if-no-files-found: ignore
          retention-days: 7

  banc-sequentiel:
    needs: passages
    name: banc-sequentiel${{ needs.passages.outputs.n != '1' && format(' (passage {0})', matrix.essai) || '' }}
    strategy:
      fail-fast: false
      matrix:
        essai: ${{ fromJSON(needs.passages.outputs.liste) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 243 : v2-fiche-rapide-232 lit le commit d'avant (git show)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aucun secret, aucune adresse de la base dans l'environnement
        shell: bash
        run: |
          if env | grep -Ei 'supabase\.co|SUPABASE|eyJ[A-Za-z0-9_-]{20,}'; then
            echo "::error::une variable d'environnement touche à Supabase ou ressemble à une clé"; exit 1
          fi
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - run: npx playwright install --with-deps chromium || npx playwright install chromium   # repli : miroir Ubuntu injoignable (11/11/2026)
      - name: Machine
        shell: bash
        run: |
          echo "nproc=$(nproc)"; free -m; df -h /dev/shm /tmp
      - name: Banc de séance séquentiel (la référence)
        shell: bash
        run: |
          export CHROME_BIN="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          node tests/banc/seance-rapide.js --sequentiel --rapport seq.json 2>&1 | tee banc-sequentiel.txt
      - name: Résumé
        if: always()
        shell: bash
        run: |
          { echo '### Banc séquentiel'; echo '```'; grep -E 'contrôles ·|en échec|\[exception\]' banc-sequentiel.txt | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Annotations (lisibles par l'API REST)
        if: always()
        run: node .github/annoter.js "Banc séquentiel" banc-sequentiel.txt $(grep -oP "code [1-9] .*journal \K\S+" banc-sequentiel.txt | head -1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: banc-sequentiel-${{ matrix.essai }}
          path: |
            banc-sequentiel.txt
            seq.json
            /tmp/banc-groupe-*/journal.txt
          if-no-files-found: ignore
          retention-days: 7
