name: Tests

on: [push, pull_request]

# 59-2 — le jeton du dépôt en lecture seule : le job installe et teste, il
# n'écrit rien (ni commentaire, ni statut, ni paquet).
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 243 : v2-fiche-rapide-232 lit le commit d'avant (git show)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
