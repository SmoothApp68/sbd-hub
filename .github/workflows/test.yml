name: Tests

# CI-1 : un push sur une branche de PR lançait ce job DEUX fois (push + pull_request) : les deux jouent le même état.
# On garde pull_request (la coche de la PR) et le push sur main (la fusion).
on:
  push:
    branches: [main]
  pull_request:

# CI sans gaspillage : un nouveau push sur la même branche remplace l'exécution en cours (les tests unitaires
# du commit d'avant ne servent plus). Sur main, chaque fusion garde son exécution.
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 59-2 — le jeton du dépôt en lecture seule : le job installe et teste, il
# n'écrit rien (ni commentaire, ni statut, ni paquet).
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 243 : v2-fiche-rapide-232 lit le commit d'avant (git show)
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
