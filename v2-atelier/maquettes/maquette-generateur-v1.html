<style>
:root{--anthracite:#0f1114;--surface:#181b20;--surface2:#21252c;--trait:#2c3139;--texte:#eceef2;--gris:#9aa0ab;--ambre:#f2b84b;--ambre-fond:#2a2214;--sur-ambre:#1a1406;

*{box-sizing:border-box}
body{margin:0;background:var(--anthracite);color:var(--texte);font:15px/1.45 var(--f-texte)}
.page{max-width:1080px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.page{grid-template-columns:392px minmax(0,1fr)}}
h1{font:700 26px/1.1 var(--f-chiffres);letter-spacing:.02em;margin:0 0 4px}
.sous{color:var(--gris);font-size:13px;margin:0 0 12px}
.scen{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.scen button{background:var(--surface2);border:1px solid var(--trait);border-radius:8px;color:var(--gris);font:500 12.5px var(--f-texte);padding:6px 9px;cursor:pointer}
.scen button[aria-pressed="true"]{color:var(--texte);border-color:var(--ambre)}
#tel{border:1px solid var(--trait);border-radius:30px;background:var(--anthracite);overflow:hidden;max-width:392px;display:flex;flex-direction:column;min-height:700px;position:relative}
.haut{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;color:var(--gris);font:600 14px var(--f-texte)}
.corps{flex:1;padding:6px 16px 12px;overflow:auto}
.etape{font:700 12px var(--f-texte);letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:4px 0 6px}
.q{font:700 24px/1.15 var(--f-chiffres);margin:0 0 6px}
.voix{display:flex;gap:8px;color:var(--ambre);font-size:14px;margin:8px 0 12px}
.voix::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;background:var(--ambre);transform:rotate(45deg)}
.puces{display:flex;flex-wrap:wrap;gap:8px}
.puce{background:var(--surface);border:1.5px solid var(--trait);border-radius:999px;padding:8px 13px;color:var(--texte);font:500 14px var(--f-texte);cursor:pointer}
.puce[aria-pressed="true"]{border-color:var(--ambre);background:var(--ambre-fond)}
.sous-titre{font:700 12px var(--f-texte);letter-spacing:.08em;text-transform:uppercase;color:var(--gris);margin:16px 0 6px}
.rt{background:var(--surface);border:1px solid var(--trait);border-radius:12px;margin-bottom:10px;overflow:hidden}
.rt-t{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 2px}
.rt-t b{font:700 18px var(--f-chiffres);letter-spacing:.02em}
.rt-t span{color:var(--gris);font:600 14px var(--f-chiffres)}
.pq{color:var(--gris);font-size:12.5px;padding:0 12px 6px}
.ex{display:flex;justify-content:space-between;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--trait);color:var(--texte);font:500 14px var(--f-texte);text-align:left;padding:9px 12px;cursor:pointer}
.ex .c{font:700 16px var(--f-chiffres);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex small{display:block;color:var(--gris);font-size:12px}
.ex.neuf{background:var(--ambre-fond)}
.bas{padding:12px 16px 18px;border-top:1px solid var(--trait)}
.bouton{width:100%;height:50px;border-radius:12px;border:0;background:var(--ambre);color:var(--sur-ambre);font:700 16px var(--f-texte);cursor:pointer}
.bouton.second{background:var(--surface2);color:var(--texte);margin-top:8px}
.voile{position:absolute;inset:0;background:#0009;display:flex;align-items:flex-end}
.feuille{width:100%;background:var(--surface);border-top:1px solid var(--trait);border-radius:18px 18px 0 0;padding:14px 16px 18px}
.feuille h3{margin:0 0 4px;font:700 20px var(--f-chiffres)}
.feuille p{margin:0 0 10px;color:var(--gris);font-size:13px}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--trait);background:var(--surface2);color:var(--texte);border-radius:12px;padding:11px 13px;margin:6px 0;font:600 15px var(--f-texte);cursor:pointer}
.opt small{display:block;color:var(--gris);font-weight:400;font-size:12.5px;margin-top:2px}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--trait);font-size:14px}
.ligne .g{color:var(--gris)}
.lien{background:none;border:0;color:var(--ambre);font:600 13.5px var(--f-texte);cursor:pointer;padding:0}
.carte{background:var(--ambre-fond);border:1px solid #5a4520;border-radius:14px;padding:12px 13px;margin:6px 0 14px}
.carte b{display:block;font:700 18px var(--f-chiffres);margin-bottom:4px}
.carte p{margin:0 0 10px;font-size:14px}
.carte .row{display:flex;gap:8px}
.carte .row button{flex:1;height:42px;border-radius:10px;border:0;font:700 14px var(--f-texte);cursor:pointer}
.carte .oui{background:var(--ambre);color:var(--sur-ambre)} .carte .non{background:var(--surface2);color:var(--texte)}
.fantome{opacity:.45;pointer-events:none}
.explic h2{font:700 20px var(--f-chiffres);letter-spacing:.02em;margin:0 0 6px}
.explic p{margin:8px 0;color:#c9cdd4;max-width:62ch}
.explic b{color:var(--texte)}
.valider{margin-top:14px;border:1px solid var(--trait);border-radius:12px;padding:12px 14px;background:var(--surface)}
.valider h3{margin:0 0 6px;font:700 12px var(--f-texte);text-transform:uppercase;letter-spacing:.08em;color:var(--ambre)}
.valider ol{margin:0;padding-left:20px;color:#c9cdd4}
.valider li{margin:6px 0}
button:focus-visible{outline:2px solid var(--ambre);outline-offset:2px}
</style>

const ns=' ';
const clone=o=>JSON.parse(JSON.stringify(o));
const S={scen:'questions',jours:4,zone:'aucune',prog:clone(D.base),feuille:null,neuf:{},ecartes:[],annonce:null};
const SCEN=[['questions','8b : les questions'],['apercu','L\'aperçu'],['genou','Genou à ménager'],['dos','Dos à ménager'],['pdc','Poids du corps'],['profil','Profil'],['carte','3 semaines plus tard']];
function progDe(sc){return sc==='genou'?D.genou:sc==='dos'?D.dos:sc==='pdc'?D.pdc:S.prog}
const ZNOM={genou:'ton genou',dos:'ton dos'};
function phraseZone(sc,prog){
 if(sc==='pdc'){const bf=[...new Set(prog.flatMap(r=>r.ex.filter(e=>e.bf).map(e=>e.n)))];
  return bf.length?`${bf.join(' et ')} ${bf.length>1?'demandent':'demande'} une barre fixe. Sans barre : touche-le, puis Remplacer.`:''}
 if(sc!=='genou'&&sc!=='dos')return '';
 const m=[...new Set(prog.flatMap(r=>r.ex.filter(e=>e.m).map(e=>e.n)))];
 return `Tu ménages ${ZNOM[sc]} : ${m.join(', ')}, sans série lourde. Toutes leurs séries restent${sc==='dos'?' ; 8 répétitions au plus au soulevé':''}.`}
function routines(sc,prog,actif){
 return prog.map((r,i)=>`<div class="rt"><div class="rt-t"><b>${r.nom}</b><span>≈${ns}${r.duree}${ns}min</span></div><div class="pq">${r.pq}</div>
 ${r.ex.map((e,k)=>`<button class="ex ${S.neuf[i+'-'+k]&&sc==='apercu'?'neuf':''}" ${actif?`data-r="${i}" data-k="${k}"`:''}><span>${e.n}${e.m?`<small>sans série lourde · ${ZNOM[sc]}</small>`:''}${e.bf&&sc==='pdc'?'<small>demande une barre fixe</small>':''}</span><span class="c">${e.series}${ns}×${ns}${e.reps}</span></button>`).join('')}</div>`).join('')}
function ecran(){
 const sc=S.scen;
 if(sc==='questions')return `<div class="haut">‹ Retour</div><div class="corps">
 <p class="etape">Ton programme</p><h2 class="q">Combien de jours par semaine, réalistement ?</h2>
 <div class="puces">${[2,3,4,5,6].map(v=>`<button class="puce" data-jours="${v}" aria-pressed="${S.jours===v}">${v}</button>`).join('')}</div>
 <p class="sous-titre">Une zone à ménager ?</p>
 <div class="puces">${['épaule','dos','genou','coude','hanche','aucune'].map(v=>`<button class="puce" data-zone="${v}" aria-pressed="${S.zone===v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>
 <p class="voix">Je garde l'exercice et toutes ses séries, sans série lourde. Rien en séance : si ça fait mal, « J'ai mal » est là.</p>
 </div><div class="bas"><button class="bouton" data-aller="${S.zone==='genou'?'genou':S.zone==='dos'?'dos':'apercu'}">Voir mon programme</button></div>`;
 if(sc==='profil')return `<div class="haut">Profil</div><div class="corps">
 <p class="sous-titre">Ton programme</p>
 <div class="ligne"><span>Dossier</span><span class="g">Mon programme · 4 routines</span></div>
 <div class="ligne"><span>Zone à ménager</span><span>Genou <button class="lien">changer</button></span></div>
 <p class="sous-titre">Exercices écartés</p>
 ${(S.ecartes.length?S.ecartes:['Squat (Barre)']).map(n=>`<div class="ligne"><span>${n}</span><button class="lien">Reprendre</button></div>`).join('')}
 <p class="pq" style="padding:6px 0">Un exercice écarté n'est plus proposé dans tes programmes. Il reste au catalogue, en fin de liste.</p>
 <button class="bouton second" style="margin-top:14px">Refaire mon programme</button>
 <p class="pq" style="padding:6px 0">Je pose les questions de 8b, et je te construis un nouveau dossier. « Mon programme » reste tel quel.</p>
 </div>`;
 if(sc==='carte')return `<div class="haut">Saisie</div><div class="corps">
 <div class="carte"><b>Ton programme tourne depuis 3 semaines.</b>
 <p>Un bloc de 4 semaines en Lourd sur tes barres, la dernière plus légère : c'est là que la force se gagne. On passe en cycles ?</p>
 <div class="row"><button class="oui">Passer en cycles</button><button class="non">Pas maintenant</button></div></div>
 <div class="fantome">${routines('apercu',D.base,false)}</div></div>`;
 const prog=progDe(sc), z=phraseZone(sc,prog);
 const ann=sc==='apercu'&&S.annonce?`<p class="voix">${S.annonce}</p>`:'';
 return `<div class="haut">‹ Retour</div><div class="corps">
 <p class="etape">Ton programme</p><h2 class="q">${prog.length} séances par semaine.</h2>
 <p class="voix">Je te propose tes charges à chaque séance. Touche un exercice pour le changer.</p>${z?`<p class="voix">${z}</p>`:''}${ann}
 ${routines(sc,prog,true)}</div>
 <div class="bas"><button class="bouton">Créer ces ${prog.length} routines</button></div>
 ${S.feuille?feuille(prog):''}`}
function feuille(prog){const [r,k]=S.feuille, e=prog[r].ex[k];
 return `<div class="voile" data-fermer="1"><div class="feuille"><h3>${e.n}</h3><p>${prog[r].nom} · ${e.series}${ns}×${ns}${e.reps}</p>
 <button class="opt" data-nveux="1">Je n'en veux pas<small>Je le remplace par un exercice du même mouvement, et je ne te le proposerai plus.</small></button>
 <button class="opt" data-remplacer="1">Remplacer<small>Tu choisis dans le catalogue. La ligne de la séance se met à jour.</small></button>
 <button class="opt" data-fermer="1">Annuler</button></div></div>`}
const E={
questions:`<h2>8b : les questions</h2><p>Deux questions seulement. <b>Les exercices aimés ou jamais sont partis</b> (décidé le 08/10, question 2) : l'historique dit déjà ce qu'on aime, et le refus se fait face à l'exercice, dans l'aperçu.</p><p>Les jours sont pré-remplis par le rythme (3a) ou la réponse de 3b. La zone à ménager reprend <code>zones_a_menager</code> (v2_065).</p><p>Choisis « Genou » ou « Dos » puis « Voir mon programme » pour l'aperçu correspondant.</p>`,
apercu:`<h2>L'aperçu</h2><p>Sous chaque séance, <b>la ligne « pourquoi »</b> : les séries par groupe musculaire. Un fait, qui se met à jour quand on remplace.</p><p><b>Touche un exercice</b>, puis « Je n'en veux pas » : <b>seule cette place change</b>, le coach prend le suivant du même mouvement. La ligne « pourquoi » ne bouge pas, puisque le muscle garde son travail. Regénérer tout le programme faisait cascader les choix (mesuré : écarter le couché barre changeait aussi le Haut B).</p><p>Les charges ne sont jamais dans l'aperçu : le coach les propose séance par séance.</p>
<div class="valider"><h3>À valider</h3><ol><li>La ligne « pourquoi » compte chaque exercice dans le groupe de son <b>premier muscle principal</b> (les tractions comptent pour le dos, pas pour les bras) ; les libellés sont ceux du radar (« Poitrine »).</li><li>Le remplaçant évite un exercice déjà dans <b>la même séance</b>, pas dans la semaine : un leg curl allongé deux jours par semaine vaut mieux qu'un deuxième soulevé roumain dans la même séance.</li><li>Les routines vont dans le dossier « Mon programme », par le même chemin que le 60-3.</li></ol></div>`,
genou:`<h2>Genou à ménager</h2><p>Décidé le 08/10 (question 1) : <b>pas de série lourde, toutes les séries gardées</b>. Le squat passe de 4${ns}×${ns}5 à 4${ns}×${ns}9 ; les quadris gardent leurs séries.</p><p>Pas de variante « douce » pour le genou : le catalogue n'en a pas d'évidente (pas de box squat). Seule la charge baisse.</p><p>Une phrase le dit, et chaque exercice concerné porte la mention.</p>`,
dos:`<h2>Dos à ménager</h2><p>Les seuls cas évidents prennent une variante plus tolérée : <b>Belt Squat</b> (la charge est à la ceinture), <b>barre hex</b> (Swinton 2011 : moins de contrainte lombaire), <b>rowing poitrine appuyée</b> (le bas du dos ne tient pas le buste). Et le soulevé ne dépasse jamais 8 répétitions : à 9 et plus, la fatigue défait la technique.</p><div class="valider"><h3>À valider</h3><ol><li>Le soulevé roumain reste, sans série lourde : je ne le remplace pas d'office par un leg curl, parce que c'est le seul travail de charnière de la semaine. Si tu préfères le retirer pour un dos à ménager, dis-le.</li></ol></div>`,
pdc:`<h2>Poids du corps</h2><p>Décidé le 08/10 (question 3) : <b>les tirages à l'élastique d'abord</b> (deux exercices ajoutés au catalogue par v2_066), puis tractions et rowing inversé, avec une phrase et une mention : ils demandent une barre fixe.</p><p>3 jours, corps entier. Le volume est faible (6 séries par semaine pour le dos) : c'est le mini-chantier « maison et poids du corps », plus tard.</p>`,
profil:`<h2>Profil</h2><p><b>Exercices écartés</b> : chacun se reprend d'un geste. Un écarté n'est plus proposé par le générateur ni par « Je n'en veux pas », et il est <b>rangé</b> en fin de liste dans le catalogue, les frères et « Remplacer », avec la mention « écarté » : la règle du matériel, « range, ne cache jamais ».</p><p><b>Refaire mon programme</b> : un nouveau dossier, l'ancien reste. Une décision ne s'efface jamais en silence.</p><div class="valider"><h3>À valider</h3><ol><li>« Je n'en veux pas » existe dans l'aperçu et dans l'éditeur de routine, à côté de « Remplacer ». <b>Pas en séance</b> : là, un refus est souvent passager.</li></ol></div>`,
carte:`<h2>3 semaines plus tard</h2><p>Décidé le 08/10 (question 4) : le générateur crée des <b>routines simples</b>. Pour <b>Force</b> et <b>Les deux</b> seulement, une carte propose les cycles. « Passer en cycles » ouvre « Faire de ce dossier un programme », réglé sur Lourd, 4 semaines, décharge la dernière (#369).</p><p>Une question, parce que le coach propose (voix du coach).</p><div class="valider"><h3>À valider</h3><ol><li>La carte s'affiche <b>une seule fois</b> : 21 jours après la création du dossier, et au moins 6 séances faites depuis ses routines. « Pas maintenant » ne la fait pas revenir ; le bouton reste dans le dossier.</li><li>Ni en « Juste un carnet », ni si le dossier est déjà un programme.</li></ol></div>`};
function rendre(){
 document.getElementById('scen').innerHTML=SCEN.map(([k,n])=>`<button data-scen="${k}" aria-pressed="${S.scen===k}">${n}</button>`).join('');
 document.getElementById('tel').innerHTML=ecran();
 document.getElementById('explic').innerHTML=E[S.scen];}
document.getElementById('scen').onclick=ev=>{const b=ev.target.closest('button');if(b){S.scen=b.dataset.scen;S.feuille=null;rendre();}};
document.getElementById('tel').onclick=ev=>{
 const b=ev.target.closest('button,[data-fermer]');if(!b)return;
 if(b.dataset.jours){S.jours=+b.dataset.jours;return rendre();}
 if(b.dataset.zone){S.zone=b.dataset.zone;return rendre();}
 if(b.dataset.aller){S.scen=b.dataset.aller;return rendre();}
 if(b.dataset.r!==undefined){S.feuille=[+b.dataset.r,+b.dataset.k];return rendre();}
 if(b.dataset.nveux){const [r,k]=S.feuille,key=r+'-'+k,prog=progDe(S.scen),vieux=prog[r].ex[k];
  if(S.scen!=='apercu'||S.neuf[key]){S.annonce='(Maquette : un seul remplacement par place, et seulement dans l\'aperçu de base.)';S.feuille=null;S.scen='apercu';return rendre();}
  const a=D.alt[key];S.prog[r].ex[k]=a.ex;S.prog[r].pq=a.pq;S.prog[r].duree=a.duree;S.neuf[key]=1;S.ecartes.push(vieux.n);
  S.annonce=`${vieux.n} est remplacé par ${a.ex.n}. Je ne te le proposerai plus.`;S.feuille=null;return rendre();}
 if(b.dataset.remplacer){S.annonce='(Maquette : « Remplacer » ouvre le catalogue, comme dans l\'éditeur de routine.)';S.feuille=null;return rendre();}
 if(b.dataset.fermer&&(ev.target===b||b.tagName==='BUTTON')){S.feuille=null;return rendre();}
};
rendre();
