<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  connect-src 'self' https://swwygywahfdenyzotrce.supabase.co;
  img-src 'self' data:;
  style-src 'self';
  script-src 'self';
  base-uri 'none';
  form-action 'none';
  object-src 'none'">
<title>TrainHub v2</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<main class="tel">

  <!-- Connexion -->
  <section id="vue-connexion" hidden>
    <header class="entete">
      <h1>TrainHub</h1>
      <span class="jalon">v2 · socle</span>
    </header>
    <form id="form-connexion" class="carte" autocomplete="on">
      <label for="champ-email">E-mail</label>
      <input id="champ-email" type="email" name="email" autocomplete="username"
             inputmode="email" required>
      <label for="champ-mdp">Mot de passe</label>
      <input id="champ-mdp" type="password" name="password" autocomplete="current-password" required>
      <button id="btn-connexion" type="submit" class="principal">Se connecter</button>
      <p id="erreur-connexion" class="erreur" role="alert" aria-live="polite"></p>
    </form>
  </section>

  <!-- Liste des séances -->
  <section id="vue-liste" hidden>
    <header class="entete">
      <div class="entete-titre">
        <h1>Mes séances</h1>
        <div id="etat-sync" class="etat-sync"></div>
      </div>
      <div class="actions">
        <button id="btn-rafraichir" type="button" class="discret">Rafraîchir</button>
        <button id="btn-deconnexion" type="button" class="discret">Quitter</button>
      </div>
    </header>
    <div class="barre-semaine">
      <button id="btn-semaine-prec" type="button" class="nav-semaine" aria-label="Semaine précédente">‹</button>
      <span id="semaine-libelle" class="semaine-libelle"></span>
      <button id="btn-semaine-suiv" type="button" class="nav-semaine" aria-label="Semaine suivante">›</button>
    </div>
    <button id="btn-semaine-actuelle" type="button" class="discret semaine-actuelle" hidden>Cette semaine</button>
    <div id="bilan-semaine" class="bilan"></div>
    <div id="liste-seances"></div>
  </section>

  <!-- Détail d'une séance -->
  <section id="vue-detail" hidden>
    <header class="entete">
      <button id="btn-retour" type="button" class="discret">← Séances</button>
    </header>
    <div id="detail-seance"></div>
  </section>

  <!-- Onglets sans contenu. Une phrase qui dit ce qui vient, au présent et à
       l'actif. Ni excuse, ni animation. -->
  <section id="vue-saisie" hidden>
    <header class="entete"><h1>Saisie</h1></header>
    <p class="a-venir">Tu noteras ici tes séries, série par série, pendant la séance.</p>
  </section>

  <section id="vue-progression" hidden>
    <header class="entete"><h1>Progression</h1></header>
    <p class="a-venir">Tu suivras ici l'évolution de tes charges, exercice par exercice.</p>
  </section>

  <section id="vue-profil" hidden>
    <header class="entete"><h1>Profil</h1></header>
    <p class="a-venir">Tu régleras ici ton compte et ta façon de travailler.</p>
  </section>

</main>

<!-- Icône ET libellé : « Séances » et « Progression » ne se distinguent pas
     par un pictogramme seul. Aucune flèche retour — le bouton système d'Android
     s'en charge, et les conventions de plateforme ne se remplacent pas. -->
<nav class="onglets" id="onglets" aria-label="Navigation principale">
  <button id="onglet-seances" class="onglet" type="button" data-vue="racine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="onglet-nom">Séances</span></button>
  <button id="onglet-saisie" class="onglet" type="button" data-vue="saisie"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="onglet-nom">Saisie</span></button>
  <button id="onglet-progression" class="onglet" type="button" data-vue="progression"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg><span class="onglet-nom">Progression</span></button>
  <button id="onglet-profil" class="onglet" type="button" data-vue="profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg><span class="onglet-nom">Profil</span></button>
</nav>

<script src="/vendor/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/client.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/donnees.js"></script>
<script src="/js/modele.js"></script>
<script src="/js/sync.js"></script>
<script src="/js/semaine.js"></script>
<script src="/js/routeur.js"></script>
<script src="/js/sortie.js"></script>
<script src="/js/cache.js"></script>
<script src="/js/rendu.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
